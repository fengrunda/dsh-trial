# Example cordis.patch.yml fragment for dsh-eager-offload
# (merge under the profile's patch list, or rely on the bundle insert defaults).
- id: eager-offload
  config:
    offloadRoot: offload
    inlineMaxBytes: 4096
    previewHeadBytes: 1536
    previewTailBytes: 1024
    offloadReadMaxInlineBytes: 16384
    # contextClear: compaction-coupled clearing of old tool results + collapsible steps (opt-in).
    # DEFAULT OFF — acp / acp-lite leave it unconfigured.
    # T2 (tool-result clearing) + T3 (write/edit step collapsing) implemented.
    # contextClear:
    #   enabled: false                     # master switch (default false)
    #   mode: compaction-coupled            # 'off' | 'compaction-coupled'
    #   keepRecentResults: 8                # newest N results kept in full
    #   minResultBytes: 1200                # smaller results are never cleared
    #   placeholder:
    #     headBytes: 160
    #     tailBytes: 240
    #     failTailBytes: 600
    #   collapseWriteSteps:
    #     enabled: true
    #     tools: [write, edit]
    #     minArgChars: 1200
    #   clearReasoning:                     # optional T3 extension, default off
    #     enabled: false
    #     minReasoningChars: 600
    excludeTools: []
    toolOverrides:
      bash:
        inlineMaxBytes: 3072
      read:
        inlineMaxBytes: 4096
